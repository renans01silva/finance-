<style>
:root{--bg:#05070F;--bg2:#0B1030;--card:#0E1327;--tx:#F4F6FF;--mut:#9AA4CB;--line:rgba(255,255,255,.10);--seg:rgba(255,255,255,.08);--navbg:rgba(8,11,28,.86);--white:#FFFFFF;--onwhite:#05070F;--ok:#43DDA6;--okbg:rgba(67,221,166,.14);--warn:#F4C46A;--warnbg:rgba(244,196,106,.14);--bad:#FF7A8E;--badbg:rgba(255,122,142,.14);--shadow:none;--pri:#3563FF;--pri2:#2A52E0;--onpri:#FFFFFF;--link:#8BAAFF;--soft:rgba(53,99,255,0.18);--grad2:#8C5BFF;--c1:#6F95FF;--c2:#8C5BFF;--drawer:#4B2DB5;--glow1:rgba(53,99,255,0.55);--glow2:rgba(110,70,235,0.25);--sheetglow:rgba(53,99,255,0.25);--fabshadow:rgba(53,99,255,0.5);--glass:linear-gradient(135deg,rgba(53,99,255,0.38),rgba(110,70,235,0.22));--glassline:rgba(255,255,255,.12);--cc:linear-gradient(135deg,rgba(53,99,255,0.62),rgba(110,70,235,0.4) 60%,rgba(255,255,255,.12))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{max-width:640px;margin:0 auto;padding:0 18px 120px}
.top{position:sticky;top:0;z-index:15;display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top)) 0 10px;gap:12px}

.page-h{margin:10px 0 18px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}

.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.kpi .t{font-size:13px;color:var(--mut);font-weight:700;display:flex;align-items:center;gap:7px}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-1px;margin-top:10px}

.dot{width:8px;height:8px;border-radius:50%;display:inline-block}

.sobrar .t{font-size:14px;font-weight:700;opacity:.85}.sobrar .v{font-size:34px;font-weight:800;letter-spacing:-1.5px;margin-top:6px}

.pos{color:var(--ok)}.neg{color:var(--bad)}

.btn.light{background:var(--white);color:var(--onwhite)}.btn.ghost{background:var(--seg);color:var(--tx)}.btn.danger{background:var(--bad)}

.stat:last-child{border:0}.stat span{color:var(--mut);font-weight:600}.stat b{font-weight:800;font-size:15px}
.stat.total{background:var(--soft)}.stat.total span{color:var(--tx);font-weight:800}.stat.total b{font-size:18px}
.row{display:flex;align-items:center;gap:13px;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer}.row:last-child{border:0}
.row .sq{width:46px;height:46px;border-radius:15px;background:var(--sq);color:var(--sqt);display:grid;place-items:center;flex:none}
.row .sq svg.i{width:21px;height:21px}
.row .m{flex:1;min-width:0}.row .m b{display:block;font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .m small{color:var(--mut);font-size:12.5px;font-weight:600}
.row .m small.bad{color:var(--bad)}.row .m small.warn{color:var(--warn)}.row .m small.ok{color:var(--ok)}

.row .a.pos{color:var(--ok);border-color:var(--ok)}.row .a.bad{border-color:var(--bad)}.row .a.warn{border-color:var(--warn)}
.row .chev{color:var(--mut);width:18px;height:18px}

.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.ok{background:var(--okbg);color:var(--ok)}
.alert{display:flex;gap:12px;align-items:flex-start;padding:15px 16px;border-bottom:1px solid var(--line);font-size:14px;font-weight:600}.alert:last-child{border:0}
.alert svg{margin-top:1px}.alert.bad svg{color:var(--bad)}.alert.warn svg{color:var(--warn)}.alert.info svg{color:var(--pri)}.alert.ok svg{color:var(--ok)}
.seg{display:flex;background:var(--seg);border-radius:99px;padding:4px;gap:2px;margin-bottom:16px}
.seg button{flex:1;border:0;background:none;color:var(--mut);padding:10px 6px;border-radius:99px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--white);color:var(--onwhite)}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:0;background:var(--seg);color:var(--tx);padding:11px 16px;border-radius:99px;font-size:14px;font-weight:700;cursor:pointer}.chip.on{background:var(--white);color:var(--onwhite)}
.empty{text-align:center;padding:36px 20px;color:var(--mut);font-size:14px;font-weight:500}.empty svg{width:34px;height:34px;opacity:.5;margin-bottom:10px}.empty b{display:block;color:var(--tx);font-size:16px;margin-bottom:4px;font-weight:800}
.empty .btn{margin-top:16px;width:auto;padding:13px 24px;font-size:15px}
.bar{height:7px;border-radius:99px;background:var(--seg);overflow:hidden;margin-top:9px}.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--pri),var(--grad2))}
.mpick{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.mpick b{font-weight:800;font-size:17px}
.mpick button{width:42px;height:42px;border-radius:50%;border:0;background:var(--seg);color:var(--tx);display:grid;place-items:center;cursor:pointer}
.grp{font-size:12px;font-weight:800;color:var(--mut);padding:14px 16px 0;text-transform:uppercase;letter-spacing:.08em}
.creditcard{background:var(--cc);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:26px;padding:22px;margin-bottom:12px;min-height:180px;display:flex;flex-direction:column;justify-content:space-between}
.creditcard .n{font-size:15px;font-weight:700;opacity:.9}.creditcard .v{font-size:36px;font-weight:800;letter-spacing:-1.5px;margin-top:6px}.creditcard small{opacity:.85;font-weight:600}
.creditcard .bar{background:rgba(255,255,255,.25)}.creditcard .bar i{background:#fff}
.rng{display:flex;gap:6px;margin:6px 0 4px}.rng button{border:0;background:none;color:var(--mut);padding:8px 13px;border-radius:99px;font-weight:700;font-size:13px;cursor:pointer}.rng button.on{background:var(--white);color:var(--onwhite)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--navbg);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(10px + env(safe-area-inset-bottom));z-index:20}
nav button{background:none;border:0;color:var(--mut);font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 6px;min-width:60px;cursor:pointer}
nav button.on{color:var(--link)}
.fab{position:fixed;right:18px;bottom:calc(86px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--pri);color:var(--onpri);border:0;display:grid;place-items:center;box-shadow:0 10px 28px var(--fabshadow);z-index:25;cursor:pointer}
.fab svg.i{width:26px;height:26px;stroke-width:2.2}
.back{position:fixed;inset:0;background:rgba(2,4,14,.62);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:f .2s}
@keyframes f{from{opacity:0}}@keyframes up{from{transform:translateY(40px);opacity:0}}@keyframes sl{from{transform:translateX(-100%)}}
.sheet{background:var(--card);background-image:radial-gradient(100% 30% at 50% 0,var(--sheetglow),transparent);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:30px 30px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));animation:up .25s;border:1px solid var(--line);border-bottom:0}
.sheet:before{content:"";display:block;width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 16px}
.sheet h2{margin:0 0 4px;font-size:24px;font-weight:800;letter-spacing:-.5px}.sheet .lead{margin:0 0 16px}
.field{margin-top:16px}.field>label{display:block;font-size:13px;font-weight:800;margin-bottom:7px;color:var(--mut)}
.field .hint{font-size:12.5px;color:var(--mut);margin-top:6px;font-weight:500}
input,select,textarea{width:100%;background:var(--seg);border:1.5px solid transparent;color:var(--tx);border-radius:16px;padding:16px;font-size:16px;font-weight:600}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pri)}
select option{color:#000}
.opt{display:flex;align-items:center;gap:14px;padding:14px 4px;border:0;border-bottom:1px solid var(--line);cursor:pointer;background:none;width:100%;text-align:left;color:var(--tx)}
.opt:last-child{border-bottom:0}.opt .sq{width:46px;height:46px;border-radius:15px;background:var(--sq);color:var(--sqt);display:grid;place-items:center}.opt b{display:block;font-weight:800;font-size:16px}.opt small{color:var(--mut);font-size:13px;font-weight:500}.opt .t{flex:1}.opt .chev{color:var(--mut);width:18px;height:18px}
.big{font-size:40px;font-weight:800;letter-spacing:-1.5px;margin:6px 0 8px}
.drawer-back{position:fixed;inset:0;background:rgba(2,4,14,.6);z-index:50;animation:f .2s}
.drawer{position:absolute;left:0;top:0;bottom:0;width:86%;max-width:360px;background:var(--drawer);color:#fff;overflow:auto;padding:max(20px,env(safe-area-inset-top)) 16px 24px;animation:sl .25s}
.drawer .head{display:flex;align-items:center;gap:12px;padding:6px 4px 16px;border-bottom:1px solid rgba(255,255,255,.2);margin-bottom:16px}
.drawer .av{background:#fff;color:var(--drawer);width:46px;height:46px}
.drawer .head b{font-size:17px;display:block}.drawer .head small{opacity:.8}.drawer .head .x{margin-left:auto;background:none;border:0;color:#fff;cursor:pointer}
.drawer .newbtn{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.2);border:0;color:#fff;width:100%;padding:16px;border-radius:16px;font-size:16px;font-weight:700;cursor:pointer;margin-bottom:8px}
.drawer h4{font-size:12px;letter-spacing:.1em;opacity:.85;font-weight:700;margin:22px 4px 6px;text-transform:uppercase}
.drawer .it{display:flex;align-items:center;gap:14px;padding:15px 8px;color:#fff;background:none;border:0;width:100%;font-size:17px;font-weight:600;cursor:pointer;text-align:left}
.drawer .it .l{flex:1}.drawer .it .c{opacity:.7;width:18px;height:18px}.drawer .it.sel{background:rgba(255,255,255,.14);border-radius:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:150px;background:var(--white);color:var(--onwhite);padding:13px 20px;border-radius:99px;z-index:90;font-weight:800;max-width:90%;font-size:14px}
svg text{fill:var(--mut);font-size:10px;font-family:inherit;font-weight:600}
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:30px 4px}.login h1{font-size:34px;font-weight:800;letter-spacing:-1px;margin:0 0 6px}.login .btn+.btn{margin-top:10px}
.foot{font-size:12px;color:var(--mut);text-align:center;margin-top:20px;line-height:1.55;font-weight:500}

.lblrow{display:flex;align-items:center;gap:4px}
.eye{background:none;border:0;color:var(--mut);padding:8px;margin:-4px 0 -4px 2px;cursor:pointer;display:inline-grid;place-items:center;border-radius:50%;min-width:40px;min-height:40px}
.eye:hover,.eye:focus-visible{color:var(--tx);background:var(--seg);outline:0}
.eye svg.i{width:21px;height:21px}
.money.msk{letter-spacing:6px;font-weight:700}
.cmp{width:100%;border-collapse:collapse;font-size:13.5px}.cmp th{font-weight:800;color:var(--mut);text-align:right;padding:12px 14px 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em}.cmp th:first-child,.cmp td:first-child{text-align:left}
.cmp td{padding:11px 14px;border-top:1px solid var(--line);text-align:right;font-weight:700;white-space:nowrap}.cmp td:first-child{color:var(--mut);font-weight:600;white-space:normal}
.cmp tr.tot td{background:var(--soft);font-weight:800;color:var(--tx)}.cmp tr.tot td:first-child{color:var(--tx)}
@media(max-width:480px){.cmp{table-layout:fixed;font-size:12px}.cmp th{padding:12px 4px 8px;font-size:10.5px;letter-spacing:.02em}.cmp td{padding:10px 4px}.cmp th:first-child,.cmp td:first-child{width:25%;padding-left:12px}.cmp th:last-child,.cmp td:last-child{padding-right:12px}}
.phead{padding:18px 18px 4px}.phead h3{margin:0;font-size:19px;font-weight:800;letter-spacing:-.3px}.phead .lead{margin-top:2px}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 18px}.mini div{background:var(--seg);border-radius:16px;padding:12px 14px}.mini small{display:block;color:var(--mut);font-size:12px;font-weight:700}.mini b{font-size:17px;font-weight:800;letter-spacing:-.4px}
.sub{font-size:12px;font-weight:800;color:var(--mut);padding:12px 18px 2px;text-transform:uppercase;letter-spacing:.08em;display:flex;justify-content:space-between}
.row .a.two{border-radius:16px;text-align:right;padding:6px 12px;line-height:1.25}.row .a small{display:block;font-size:11px;font-weight:600;color:var(--mut)}
.row .m small.s2{display:block;margin-top:1px}
.search{position:relative;margin-bottom:10px}.search input{padding-left:46px}.search svg.i{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--mut);width:20px;height:20px;pointer-events:none}
.fbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}.fbtn{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--seg);color:var(--tx);padding:11px 16px;border-radius:99px;font-weight:700;font-size:14px;cursor:pointer}.fbtn .n{background:var(--pri);color:var(--onpri);border-radius:99px;font-size:12px;padding:1px 8px;font-weight:800}
.fchip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:none;color:var(--tx);padding:7px 8px 7px 12px;border-radius:99px;font-weight:700;font-size:12.5px;cursor:pointer}.fchip svg.i{width:14px;height:14px}
.stats4{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.stats4 .glass{padding:14px 16px}.stats4 .t{font-size:12.5px;color:var(--mut);font-weight:700}.stats4 .v{font-size:20px;font-weight:800;letter-spacing:-.6px;margin-top:6px}
.two2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.pal .sw{display:flex;height:38px;border-radius:12px;overflow:hidden}.pal .sw i{flex:1}.pal b{font-size:14px;font-weight:800;display:flex;justify-content:space-between;align-items:center}.pal small{color:var(--mut);font-size:12px;font-weight:500;line-height:1.3}
.pill.pri{background:var(--soft);color:var(--link)}
.note{background:var(--seg);border-radius:16px;padding:12px 14px;font-size:13.5px;font-weight:600;line-height:1.5;margin-top:12px}.note.warn{background:var(--warnbg);color:var(--warn)}.note.bad{background:var(--badbg);color:var(--bad)}
.chg{display:flex;justify-content:space-between;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);font-size:14px}.chg:last-child{border:0}.chg b{font-weight:800}.chg small{display:block;color:var(--mut);font-weight:600;font-size:12.5px}
@media (min-width:900px){#app{max-width:760px}.sheet{max-width:560px;border-radius:30px;margin-bottom:5vh}.back{align-items:center}.stats4{grid-template-columns:repeat(4,1fr)}}

<script>/* FINANCE CONTROL — temas (design tokens). Uma única fonte de cores: nada de cor fixa espalhada no código. */
(function (root) {
  const T = {};

      map[t.invoiceDue].totalCents += t.kind === 'refund' ? -t.amountCents : t.amountCents; map[t.invoiceDue].items.push(t);
    });
    s.tx.filter((t) => t.kind === 'invoice_payment' && t.cardRef === cardId && t.status === 'paid').forEach((t) => {
      (map[t.invoiceDue] = map[t.invoiceDue] || { cardId, dueDate: t.invoiceDue, totalCents: 0, paidCents: 0, items: [] }).paidCents += t.amountCents;
    });
    const card = s.cards.find((c) => c.id === cardId);
    return Object.values(map).sort((a, b) => a.dueDate.localeCompare(b.dueDate)).map((i) => {
      i.remainingCents = i.totalCents - i.paidCents;
      i.closingDate = card ? E.invoiceFor(card, E.addMonths(i.dueDate, card.dueDay <= card.closingDay ? -1 : 0).slice(0, 8) + pad(card.closingDay)).closingDate : null;
      i.status = i.remainingCents <= 0 && i.totalCents > 0 ? 'paid' : (E.today() > i.closingDate ? 'closed' : 'open');
      return i;
    });
  };
  // paga a fatura: sai da conta, NÃO é nova despesa
  E.payInvoice = (s, { cardId, dueDate, accountId, amountCents, date }) => {
    needAmount(amountCents);
    const inv = E.invoices(s, cardId).find((i) => i.dueDate === dueDate);
    if (!inv) throw new Error('Fatura não encontrada.');
    if (amountCents > inv.remainingCents) throw new Error('O valor é maior que o restante da fatura.');
    const card = s.cards.find((c) => c.id === cardId);
    const t = { id: E.uid(), kind: 'invoice_payment', amountCents, paidCents: amountCents, accountId, cardRef: cardId, invoiceDue: dueDate, context: card.context, desc: 'Pagamento da fatura ' + card.name, status: 'paid', paidDate: date || E.today(), purchaseDate: date || E.today(), dueDate, categoryId: null, history: [] };
    s.tx.push(t); hist(t, 'criada'); return t;
  };
  E.cardLimit = (s, card) => {
    const used = E.invoices(s, card.id).reduce((a, i) => a + Math.max(i.remainingCents, 0), 0);
    return { usedCents: used, availableCents: card.limitCents - used };
  };

  // ───── recorrências (geram lançamentos novos; histórico intocado)
  E.addRecurring = (s, o) => {
    needAmount(o.amountCents);
    const r = { id: E.uid(), kind: o.kind, desc: o.desc, amountCents: o.amountCents, accountId: o.accountId, categoryId: o.categoryId, day: o.day, context: o.context || 'personal', startDate: o.startDate, generatedUntil: null, fundSlot: o.fundSlot === 1 || o.fundSlot === 2 ? o.fundSlot : null };
    s.recurrences.push(r); E.generateRecurring(s, o.today || E.today(), 12); return r;
  };
  E.generateRecurring = (s, today, monthsAhead) => {
    const limit = E.addMonths(today.slice(0, 8) + '01', monthsAhead);
    let n = 0;
    s.recurrences.forEach((r) => {
      for (let i = 0; i < 400; i++) {
        const m = E.addMonths(r.startDate.slice(0, 8) + '01', i);
        if (m > limit) break;
        const due = m.slice(0, 8) + pad(Math.min(r.day, E.daysInMonth(+m.slice(0, 4), +m.slice(5, 7))));
        if (due < r.startDate) continue;
        if (s.tx.some((t) => t.recurrenceId === r.id && t.dueDate === due)) continue; // nunca duplica
        const t = Object.assign(base(s, { desc: r.desc, categoryId: r.categoryId, context: r.context, date: due, dueDate: due }), { kind: r.kind, amountCents: r.amountCents, accountId: r.accountId, recurrenceId: r.id, method: 'auto_debit' });
        if (r.fundSlot && r.kind === 'expense') t.fund = E.fundForSlot(s, due, r.fundSlot);
        if (r.fundSlot && r.kind === 'income') t.slot = r.fundSlot;
        s.tx.push(t); hist(t, 'gerada pela recorrência'); n++;
      }
    });
    return n;
  };

  // ───── consultas
  const inCtx = (t, ctx) => ctx === 'all' || t.context === ctx;
  const live = (s, ctx) => s.tx.filter((t) => t.status !== 'cancelled' && inCtx(t, ctx));
  // "gasto" = despesa já efetivada: compra no cartão (data da compra) ou conta paga (data do pagamento). Contas só previstas ficam em "a pagar".
  const spentDate = (t) => t.kind === 'refund' ? t.purchaseDate : t.kind !== 'expense' ? '' : t.cardId ? t.purchaseDate : (t.status === 'paid' ? t.paidDate : '');
  const spentVal = (t) => t.kind === 'refund' ? -t.amountCents : t.cardId ? t.amountCents : (t.paidCents || t.amountCents);
  E.isOverdue = (t, today) => t.status === 'pending' && !t.cardId && t.dueDate && t.dueDate < today;

  E.accountBalance = (s, acc) => {
    let c = acc.openingCents;
    s.tx.forEach((t) => {
      if (t.status !== 'paid') return;
      const v = t.paidCents || t.amountCents;
      if (t.kind === 'income' && t.accountId === acc.id) c += v;
      else if ((t.kind === 'expense' || t.kind === 'invoice_payment') && t.accountId === acc.id) c -= v;
      else if (t.kind === 'transfer') { if (t.accountId === acc.id) c -= v; if (t.toAccountId === acc.id) c += v; }
    });
    return c;
  };
  E.totalAvailable = (s, ctx) => s.accounts.filter((a) => !a.archived && inCtx(a, ctx)).reduce((a, x) => a + E.accountBalance(s, x), 0);

  // Faturas ainda a pagar (com vencimento até "until")
  const invoicesDue = (s, ctx, until) => {
    let total = 0;
    s.cards.filter((c) => inCtx(c, ctx)).forEach((c) => E.invoices(s, c.id).forEach((i) => { if (i.remainingCents > 0 && (!until || i.dueDate <= until)) total += i.remainingCents; }));
    return total;
  };

  E.monthSummary = (s, month, ctx = 'all', today = E.today()) => {
    const end = E.endOfMonth(month + '-01'), start = month + '-01';
    const L = live(s, ctx);
    const receivedCents = L.filter((t) => t.kind === 'income' && t.status === 'paid' && t.paidDate >= start && t.paidDate <= end).reduce((a, t) => a + (t.paidCents || t.amountCents), 0);
    const toReceiveCents = L.filter((t) => t.kind === 'income' && t.status === 'pending' && t.dueDate <= end).reduce((a, t) => a + t.amountCents, 0);
    // gasto = despesas (conta ou cartão) com data de competência no mês; transferências e pagamento de fatura NUNCA entram
    const spentCents = L.filter((t) => spentDate(t) >= start && spentDate(t) <= end).reduce((a, t) => a + spentVal(t), 0);
    const toPayAccount = L.filter((t) => t.kind === 'expense' && !t.cardId && t.status === 'pending' && t.dueDate <= end).reduce((a, t) => a + t.amountCents, 0);
    const toPayCards = invoicesDue(s, ctx, end);
    const toPayCents = toPayAccount + toPayCards;
    const availableCents = E.totalAvailable(s, ctx);
    const projectedCents = availableCents + toReceiveCents - toPayCents;
    const overdueCents = L.filter((t) => E.isOverdue(t, today) && t.kind === 'expense').reduce((a, t) => a + t.amountCents, 0);
    const incomeMonth = L.filter((t) => t.kind === 'income' && t.dueDate >= start && t.dueDate <= end).reduce((a, t) => a + t.amountCents, 0);
    return { receivedCents, toReceiveCents, spentCents, toPayCents, availableCents, projectedCents, overdueCents, incomeMonthCents: incomeMonth };
  };

  // próximos vencimentos (contas + faturas) em N dias
  E.upcoming = (s, days, ctx = 'all', today = E.today()) => {
    const lim = E.addDays(today, days), items = [];
    live(s, ctx).forEach((t) => {
      if (t.status !== 'pending' || t.cardId || t.kind === 'transfer') return;
      if (t.dueDate <= lim) items.push({ type: t.kind, id: t.id, desc: t.desc, amountCents: t.amountCents, dueDate: t.dueDate, overdue: t.dueDate < today });
    });
    s.cards.filter((c) => inCtx(c, ctx)).forEach((c) => E.invoices(s, c.id).forEach((i) => {
      if (i.remainingCents > 0 && i.dueDate <= lim) items.push({ type: 'invoice', cardId: c.id, dueDate: i.dueDate, desc: 'Fatura ' + c.name, amountCents: i.remainingCents, overdue: i.dueDate < today });
    }));
    return items.sort((a, b) => a.dueDate.localeCompare(b.dueDate));
  };

  // projeção diária do saldo (para achar dia negativo)
  E.projection = (s, days, ctx = 'all', today = E.today()) => {
    let bal = E.totalAvailable(s, ctx), out = [];
    const items = E.upcoming(s, days, ctx, today);
    for (let d = 0; d <= days; d++) {
      const day = E.addDays(today, d);
      items.filter((i) => (d === 0 ? i.dueDate <= day : i.dueDate === day)).forEach((i) => { bal += i.type === 'income' ? i.amountCents : -i.amountCents; });
      out.push({ date: day, balanceCents: bal });
    }
    return out;
  };

  E.byCategory = (s, month, ctx = 'all') => {
    const m = {};
    live(s, ctx).filter((t) => spentDate(t) && E.ym(spentDate(t)) === month).forEach((t) => { const k = t.categoryId || 'sem'; m[k] = (m[k] || 0) + spentVal(t); });
    return m;
  };
  E.monthSeries = (s, endMonth, n, ctx = 'all') => Array.from({ length: n }, (_, i) => {
    const mo = E.addMonths(endMonth + '-01', i - n + 1).slice(0, 7);
    const L = live(s, ctx);
    return { month: mo,
      income: L.filter((t) => t.kind === 'income' && t.status === 'paid' && E.ym(t.paidDate) === mo).reduce((a, t) => a + (t.paidCents || t.amountCents), 0),
      expense: L.filter((t) => spentDate(t) && E.ym(spentDate(t)) === mo).reduce((a, t) => a + spentVal(t), 0) };
  });
  E.budgetStatus = (s, month, ctx = 'all') => {
    const spent = E.byCategory(s, month, ctx), out = [];
    Object.entries(s.budgets).forEach(([k, cents]) => {
      if (!k.startsWith(month + '|')) return;
      const cat = k.split('|')[1], used = spent[cat] || 0, pct = cents ? Math.round((used / cents) * 100) : 0;
      out.push({ categoryId: cat, budgetCents: cents, usedCents: used, pct, level: pct >= 100 ? 100 : pct >= 90 ? 90 : pct >= 70 ? 70 : 0 });
    });
    return out;
  };

  // ───── linguagem natural: "Hoje gastei R$ 85 no mercado via Pix"
  const METHODS = [['pix', /\bpix\b/i], ['credit_card', /cart[aã]o|cr[eé]dito/i], ['debit_card', /d[eé]bito/i], ['cash', /dinheiro|esp[eé]cie/i], ['boleto', /boleto/i], ['transfer', /transfer/i]];
  const KEYWORDS = { 'e_Alimentação': ['mercado', 'supermercado', 'padaria', 'restaurante', 'lanche', 'ifood', 'almoço', 'jantar', 'feira'], 'e_Transporte': ['uber', 'ônibus', 'onibus', 'metrô', 'metro', 'gasolina', 'combustível', 'estacionamento', 'pedágio'], 'e_Saúde': ['farmácia', 'farmacia', 'médico', 'medico', 'consulta', 'remédio', 'remedio'], 'e_Moradia': ['aluguel', 'condomínio', 'condominio', 'luz', 'água', 'agua', 'internet', 'gás', 'gas'], 'e_Lazer': ['cinema', 'netflix', 'spotify', 'passeio', 'viagem'], 'e_Educação': ['escola', 'curso', 'inglês', 'ingles', 'faculdade', 'livro'], 'e_Família': ['bebê', 'bebe', 'fralda', 'filho', 'brinquedo'] };
  E.suggestCategory = (s, desc) => {
    const d = (desc || '').toLowerCase(); if (!d) return null;
    const words = d.split(/\s+/).filter((w) => w.length > 2), score = {};
    s.tx.filter((t) => t.kind === 'expense' && t.categoryId).forEach((t) => { const td = t.desc.toLowerCase(); if (words.some((w) => td.includes(w))) score[t.categoryId] = (score[t.categoryId] || 0) + 1; });
    const best = Object.entries(score).sort((a, b) => b[1] - a[1])[0]; if (best) return best[0];
    for (const [cat, ks] of Object.entries(KEYWORDS)) if (ks.some((k) => d.includes(k))) return cat;
    return null;
  };
  E.parseNatural = (s, text, today = E.today()) => {
    const out = { kind: 'expense', missing: [] }, t = text.trim();
    if (/\b(recebi|ganhei|entrou|caiu)\b/i.test(t)) out.kind = 'income';
    const m = t.match(/R\$\s*([\d.]+(?:,\d{1,2})?)|(\d+(?:[.,]\d{1,2})?)\s*(?:reais|real)/i);
    if (m) out.amountCents = E.toCents(m[1] || m[2]); else out.missing.push('valor');
    out.date = /\bontem\b/i.test(t) ? E.addDays(today, -1) : today;
    for (const [k, re] of METHODS) if (re.test(t)) { out.method = k; break; }
    if (!out.method && out.kind === 'expense') out.missing.push('forma de pagamento');
    const d = t.match(/\b(?:no|na|em|com|de|do|da)\s+([^\d,.]+?)(?:\s+(?:via|no|na|com|por)\b|$)/i);
    out.desc = d ? d[1].trim().replace(/^(o|a|os|as)\s+/i, '') : '';
    if (out.desc) out.desc = out.desc[0].toUpperCase() + out.desc.slice(1);
    out.categoryId = out.kind === 'expense' ? E.suggestCategory(s, out.desc) : null;
    return out;
  };

  // ───── patrimônio simples
  E.netWorth = (s, ctx = 'all') => {
    const assets = E.totalAvailable(s, ctx);
    const debt = s.cards.filter((c) => inCtx(c, ctx)).reduce((a, c) => a + E.cardLimit(s, c).usedCents, 0);
    return { assetsCents: assets, liabilitiesCents: debt, netCents: assets - debt };
  };

  // ───── textos de orientação (só com dados reais)
  E.insights = (s, ctx, today = E.today()) => {
    const out = [], mo = E.ym(today), prev = E.addMonths(today.slice(0, 8) + '01', -1).slice(0, 7);
    E.upcoming(s, 7, ctx, today).forEach((i) => {
      const d = E.diffDays(today, i.dueDate);
      if (i.type === 'income') return;
      if (d < 0) out.push({ level: 'bad', text: `${i.desc} está atrasada desde ${E.fmtDate(i.dueDate)} (${E.brl(i.amountCents)}).`, ref: i });
      else if (d === 0) out.push({ level: 'warn', text: `${i.desc} vence hoje (${E.brl(i.amountCents)}).`, ref: i });
      else if (d === 1) out.push({ level: 'warn', text: `${i.desc} vence amanhã (${E.brl(i.amountCents)}).`, ref: i });
    });
    E.budgetStatus(s, mo, ctx).filter((b) => b.level).forEach((b) => { const c = s.categories.find((x) => x.id === b.categoryId); out.push({ level: b.level >= 100 ? 'bad' : 'warn', text: `Você já usou ${b.pct}% do orçamento de ${c ? c.name : 'categoria'}.` }); });
    const cur = E.byCategory(s, mo, ctx), old = E.byCategory(s, prev, ctx);
    const tc = Object.values(cur).reduce((a, b) => a + b, 0), to = Object.values(old).reduce((a, b) => a + b, 0);
    if (to > 0 && tc > to && E.diffDays(mo + '-01', today) >= 15) out.push({ level: 'info', text: `Você gastou ${E.brl(tc - to)} a mais que em todo o mês passado.` });
    const proj = E.projection(s, 30, ctx, today).find((p) => p.balanceCents < 0);
    if (proj) out.push({ level: 'bad', text: `Atenção: sua projeção indica saldo negativo em ${E.fmtDate(proj.date)}.` });
    return out.concat(E.planInsights(s, ctx, today), E.periodInsights(s, ctx, today));
  };


  // ═════════ FINANCE CONTROL 2.0 ═════════

  // ───── 1) Recebimentos por período (dias configuráveis, padrão 10 e 25)
  const DEFAULT_PAYDAYS = [10, 25];
  const MS = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  E.cfg = (s) => { const p = (s.settings || {}).payDays; return { payDays: Array.isArray(p) && p.length === 2 && p[0] >= 1 && p[1] <= 28 && p[0] < p[1] ? p.slice() : DEFAULT_PAYDAYS.slice() }; };
  E.setPayDays = (s, a, b) => {
    a = +a; b = +b;
    if (!(Number.isInteger(a) && Number.isInteger(b) && a >= 1 && b <= 28 && a < b)) throw new Error('Informe dois dias entre 1 e 28, sendo o primeiro menor que o segundo.');
    s.settings = s.settings || {}; s.settings.payDays = [a, b];
  };
  E.pk = (ym, slot) => ym + '|' + slot;
  E.parsePk = (pk) => ({ ym: pk.slice(0, 7), slot: +pk.slice(8) });
  E.paydayDate = (s, pk) => { const q = E.parsePk(pk); return q.ym + '-' + pad(E.cfg(s).payDays[q.slot - 1]); };
  E.fundLabel = (s, pk) => { const q = E.parsePk(pk); return 'Dia ' + E.cfg(s).payDays[q.slot - 1] + ' · ' + MS[+q.ym.slice(5) - 1] + '/' + q.ym.slice(0, 4); };
  E.periodRange = (s, pk) => {
    const q = E.parsePk(pk), start = E.paydayDate(s, pk);
    const next = q.slot === 1 ? E.paydayDate(s, E.pk(q.ym, 2)) : E.paydayDate(s, E.pk(E.addMonths(q.ym + '-01', 1).slice(0, 7), 1));
    return { start, end: E.addDays(next, -1) };
  };
  // em qual período entra uma receita: escolha do usuário (slot) ou o dia de recebimento mais próximo da data
  E.slotOfDate = (s, date) => { const [a, b] = E.cfg(s).payDays, d = +date.slice(8, 10); return Math.abs(d - a) <= Math.abs(d - b) ? 1 : 2; };
  E.slotOf = (s, t) => (t.slot === 1 || t.slot === 2) ? t.slot : E.slotOfDate(s, t.dueDate || t.purchaseDate);
  E.nextPayday = (s, today = E.today()) => {
    for (let m = 0; m < 3; m++) {
      const base = E.addMonths(today.slice(0, 8) + '01', m).slice(0, 7);
      for (const slot of [1, 2]) { const pk = E.pk(base, slot), date = E.paydayDate(s, pk); if (date >= today) return { pk, date, slot, day: +date.slice(8) }; }
    }
  };
  // SUGESTÃO (nunca aplicada sozinha): o recebimento mais recente que cai até o vencimento
  E.suggestFund = (s, dueDate) => {
    const c = [];
    [-1, 0].forEach((m) => { const base = E.addMonths(dueDate.slice(0, 8) + '01', m).slice(0, 7); [1, 2].forEach((sl) => c.push({ pk: E.pk(base, sl), date: E.paydayDate(s, E.pk(base, sl)) })); });
    const ok = c.filter((x) => x.date <= dueDate); return (ok.length ? ok[ok.length - 1] : c[0]).pk;
  };
  E.fundForSlot = (s, dueDate, slot) => {
    const c = [];
    [-1, 0].forEach((m) => { const base = E.addMonths(dueDate.slice(0, 8) + '01', m).slice(0, 7); const pk = E.pk(base, slot); c.push({ pk, date: E.paydayDate(s, pk) }); });
    const ok = c.filter((x) => x.date <= dueDate); return (ok.length ? ok[ok.length - 1] : c[0]).pk;
  };
  E.fundOptions = (s, dueDate) => { const out = []; [-1, 0, 1].forEach((m) => { const base = E.addMonths(dueDate.slice(0, 8) + '01', m).slice(0, 7); [1, 2].forEach((sl) => out.push(E.pk(base, sl))); }); return out; };

  const sumPaid = (t) => t.paidCents || t.amountCents;
  E.invoiceFundOf = (s, cardId, due) => (s.invoiceFund || {})[cardId + '|' + due] || null;
  E.linkExpense = (s, id, pk) => {
    const t = s.tx.find((x) => x.id === id);
    if (!t || t.kind !== 'expense') throw new Error('Despesa não encontrada.');
    if (t.cardId) throw new Error('Compras no cartão são vinculadas pela fatura.');
    if (t.status === 'cancelled') throw new Error('Lançamento cancelado.');
    if (pk) checkPk(pk);
    hist(t, 'recebimento vinculado: ' + (t.fund ? E.fundLabel(s, t.fund) : 'sem vínculo') + ' → ' + (pk ? E.fundLabel(s, pk) : 'sem vínculo'));
    if (pk) t.fund = pk; else delete t.fund; return t;
  };
  E.linkInvoice = (s, cardId, due, pk) => {
    if (!E.invoices(s, cardId).some((i) => i.dueDate === due)) throw new Error('Fatura não encontrada.');
    s.invoiceFund = s.invoiceFund || {}; const k = cardId + '|' + due, old = s.invoiceFund[k] || null;
    if (pk) checkPk(pk);
    (s.log = s.log || []).push({ at: new Date().toISOString(), what: `fatura ${cardId} ${due}: ${old ? E.fundLabel(s, old) : 'sem vínculo'} → ${pk ? E.fundLabel(s, pk) : 'sem vínculo'}` });
    if (pk) s.invoiceFund[k] = pk; else delete s.invoiceFund[k];
  };

  E.periodSummary = (s, pk, ctx = 'all', today = E.today()) => {
    const q = E.parsePk(pk), L = live(s, ctx);
    const incomes = L.filter((t) => t.kind === 'income' && E.ym(t.dueDate) === q.ym && E.slotOf(s, t) === q.slot);
    const expectedCents = incomes.reduce((a, t) => a + t.amountCents, 0);
    const receivedCents = incomes.filter((t) => t.status === 'paid').reduce((a, t) => a + sumPaid(t), 0);
    const pendingIncomeCents = incomes.filter((t) => t.status === 'pending').reduce((a, t) => a + t.amountCents, 0);
    const exps = L.filter((t) => t.kind === 'expense' && !t.cardId && t.fund === pk);
    const invs = [];
    s.cards.filter((c) => inCtx(c, ctx)).forEach((c) => E.invoices(s, c.id).forEach((i) => { if (E.invoiceFundOf(s, c.id, i.dueDate) === pk) invs.push(Object.assign({ card: c }, i)); }));
    const paidExp = exps.filter((t) => t.status === 'paid').reduce((a, t) => a + sumPaid(t), 0);
    const pendExp = exps.filter((t) => t.status === 'pending').reduce((a, t) => a + t.amountCents, 0);
    const invPaid = invs.reduce((a, i) => a + i.paidCents, 0), invPend = invs.reduce((a, i) => a + Math.max(i.remainingCents, 0), 0);
    const paidCents = paidExp + invPaid, pendingCents = pendExp + invPend, linkedCents = paidCents + pendingCents;
    return {
      pk, range: E.periodRange(s, pk), incomes, exps, invs,
      expectedCents, receivedCents, pendingIncomeCents,
      linkedCents, paidCents, pendingCents,
      pendingCount: exps.filter((t) => t.status === 'pending').length + invs.filter((i) => i.remainingCents > 0).length,
      paidCount: exps.filter((t) => t.status === 'paid').length + invs.filter((i) => i.paidCents > 0).length,
      projectedCents: expectedCents - linkedCents,       // previsto − tudo que está vinculado
      availableCents: receivedCents - paidCents,         // só dinheiro que realmente entrou, menos o que já foi pago
      afterPendingCents: receivedCents - paidCents - pendingCents,
    };
  };
  // contas e faturas ainda sem recebimento definido (dentro de um intervalo de vencimento)
  E.unlinked = (s, ctx, range) => {
    const inR = (d) => (!range || (d >= range.from && d <= range.to)), items = [];
    live(s, ctx).forEach((t) => { if (t.kind === 'expense' && !t.cardId && t.status === 'pending' && !t.fund && inR(t.dueDate)) items.push({ type: 'tx', id: t.id, desc: t.desc, amountCents: t.amountCents, dueDate: t.dueDate, suggested: E.suggestFund(s, t.dueDate) }); });
    s.cards.filter((c) => inCtx(c, ctx)).forEach((c) => E.invoices(s, c.id).forEach((i) => { if (i.remainingCents > 0 && !E.invoiceFundOf(s, c.id, i.dueDate) && inR(i.dueDate)) items.push({ type: 'inv', cardId: c.id, dueDate: i.dueDate, desc: 'Fatura ' + c.name, amountCents: i.remainingCents, suggested: E.suggestFund(s, i.dueDate) }); }));
    return items.sort((a, b) => a.dueDate.localeCompare(b.dueDate));
  };
  E.acceptSuggestions = (s, items) => { items.forEach((i) => { if (i.type === 'tx') E.linkExpense(s, i.id, i.suggested); else E.linkInvoice(s, i.cardId, i.dueDate, i.suggested); }); return items.length; };
  E.periodInsights = (s, ctx, today = E.today()) => {
    const out = [];
    if (!s.tx.some((t) => t.kind === 'income' && t.status !== 'cancelled')) return out;
    const np = E.nextPayday(s, today), sm = E.periodSummary(s, np.pk, ctx, today);
    out.push({ level: 'info', text: `Seu próximo recebimento será no dia ${np.day} (${E.fmtDate(np.date)}).` });
    if (sm.pendingCents > 0) {
      out.push({ level: 'info', text: `Você possui ${E.brl(sm.pendingCents)} em compromissos vinculados ao próximo recebimento.` });
      const f = E.totalAvailable(s, ctx) + sm.pendingIncomeCents - sm.pendingCents;
      out.push({ level: f < 0 ? 'bad' : 'info', text: `Após os pagamentos programados, sua previsão é de ${E.brl(f)} disponíveis.` });
    }
    return out;
  };

  // ───── 2) Cartões: compras (registro único) → parcelas → faturas
  const invMap = (s, cardId) => { const m = {}; E.invoices(s, cardId).forEach((i) => { m[i.dueDate] = i; }); return m; };
  // 'paid' = a fatura já recebeu pagamento; 'closed' = fatura fechada. Ambas são protegidas.
  E.lockOf = (inv) => !inv ? null : inv.paidCents > 0 ? 'paid' : inv.status === 'closed' ? 'closed' : null;
  const stripSfx = (d) => d.replace(/ \(\d+\/\d+\)$/, '');
  const sfx = (no, n) => n > 1 ? ` (${no}/${n})` : '';

  E.migrate = (s) => {
    let ch = false;
    if (!s.settings) { s.settings = { payDays: DEFAULT_PAYDAYS.slice() }; ch = true; }
    if (!s.invoiceFund) { s.invoiceFund = {}; ch = true; }
    if (!s.purchases) { s.purchases = []; ch = true; }
    if (!s.plan) { s.plan = { income: [0, 0], items: [], done: {} }; ch = true; }
    const groups = {};
    s.tx.forEach((t) => {
      if (t.kind !== 'expense' || !t.cardId || t.purchaseId) return;
      const key = t.installmentGroup || t.id; let p = groups[key];
      if (!p) {
        const all = s.tx.filter((x) => x.kind === 'expense' && x.cardId && (x.installmentGroup || x.id) === key);
        const act = all.filter((x) => x.status !== 'cancelled');
        p = { id: E.uid(), cardId: t.cardId, desc: stripSfx(t.desc), merchant: '', totalCents: (act.length ? act : all).reduce((a, x) => a + x.amountCents, 0), installments: t.installmentTotal || 1, date: t.originalDate || t.purchaseDate, categoryId: t.categoryId || null, notes: t.notes || '', context: t.context, status: act.length ? 'active' : 'cancelled', history: [{ at: new Date().toISOString(), what: 'vinculada ao registro anterior (atualização do sistema)' }] };
        s.purchases.push(p); groups[key] = p;
      }
      t.purchaseId = p.id; ch = true;
    });
    if (s.schema !== 2) { s.schema = 2; ch = true; }
    return ch;
  };

  E.purchaseInstallments = (s, pid) => {
    const p = (s.purchases || []).find((x) => x.id === pid); if (!p) return [];
    const m = invMap(s, p.cardId);
    return s.tx.filter((t) => t.purchaseId === pid && t.kind === 'expense').sort((a, b) => (a.installmentNo || 1) - (b.installmentNo || 1) || a.id.localeCompare(b.id))
      .map((t) => { const inv = m[t.invoiceDue]; return { tx: t, no: t.installmentNo || 1, of: t.installmentTotal || 1, cancelled: t.status === 'cancelled', invoiceStatus: inv ? inv.status : 'open', lock: t.status === 'cancelled' ? null : E.lockOf(inv) }; });
  };
  E.purchaseRefunds = (s, pid) => s.tx.filter((t) => t.purchaseId === pid && t.kind === 'refund' && t.status !== 'cancelled');
  E.refundable = (s, pid) => { const p = s.purchases.find((x) => x.id === pid); return p.totalCents - E.purchaseRefunds(s, pid).reduce((a, t) => a + t.amountCents, 0); };

  // Calcula (sem gravar) o que mudaria. Parcelas de fatura paga ficam sempre intactas;
  // as de fatura fechada só mudam se o usuário autorizar (opts.allowClosed).
  E.previewPurchaseEdit = (s, id, patch, opts = {}) => {
    const p = (s.purchases || []).find((x) => x.id === id);
    if (!p) throw new Error('Compra não encontrada.');
    const res = { financial: false, blocked: null, plan: [], impact: [], warnings: [], hasClosed: false, oldTotal: p.totalCents, newTotal: p.totalCents, oldN: p.installments, newN: p.installments };
    if (p.status === 'cancelled') { res.blocked = 'Esta compra foi cancelada e não pode mais ser alterada.'; return res; }
    const totalCents = patch.totalCents != null ? patch.totalCents : p.totalCents, n = patch.installments != null ? patch.installments : p.installments;
    const date = patch.date || p.date, cardId = patch.cardId || p.cardId;
    res.newTotal = totalCents; res.newN = n;
    res.financial = totalCents !== p.totalCents || n !== p.installments || date !== p.date || cardId !== p.cardId;
    if (!res.financial) return res;
    if (!Number.isInteger(totalCents) || totalCents <= 0) { res.blocked = 'Informe um valor total maior que zero.'; return res; }
    if (!Number.isInteger(n) || n < 1 || n > 48) { res.blocked = 'O número de parcelas deve ficar entre 1 e 48.'; return res; }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { res.blocked = 'Informe a data da compra.'; return res; }
    const card = s.cards.find((c) => c.id === cardId); if (!card) { res.blocked = 'Cartão não encontrado.'; return res; }
    const rows = E.purchaseInstallments(s, id).filter((r) => !r.cancelled);
    res.hasClosed = rows.some((r) => r.lock === 'closed');
    const frozen = rows.filter((r) => r.lock === 'paid' || (r.lock === 'closed' && !opts.allowClosed));
    if (cardId !== p.cardId && frozen.length) { res.blocked = 'Não é possível trocar o cartão: já existem parcelas em fatura paga ou fechada.'; return res; }
    const fnos = new Set(frozen.map((r) => r.no)), maxF = frozen.reduce((a, r) => Math.max(a, r.no), 0);
    if (n < maxF) { res.blocked = `Já existem parcelas protegidas até a ${maxF}ª (fatura paga ou fechada). O parcelamento não pode ficar menor que ${maxF}x.`; return res; }
    const free = []; for (let i = 1; i <= n; i++) if (!fnos.has(i)) free.push(i);
    const fsum = frozen.reduce((a, r) => a + r.tx.amountCents, 0), remaining = totalCents - fsum;
    if (!free.length && remaining !== 0) { res.blocked = `O valor total não bate com as parcelas protegidas (${E.brl(fsum)}).`; return res; }
    if (free.length && remaining < free.length) { res.blocked = `O valor total precisa ser maior que ${E.brl(fsum)}, que é o total das parcelas já protegidas (fatura paga ou fechada).`; return res; }
    const parts = free.length ? E.splitCents(remaining, free.length) : [];
    const m = invMap(s, p.cardId), delta = {};
    const addD = (due, c) => { delta[due] = (delta[due] || 0) + c; };
    for (let no = 1; no <= n; no++) {
      const ex = rows.find((r) => r.no === no);
      if (fnos.has(no)) { res.plan.push({ no, action: 'keep', lock: ex.lock, from: { amountCents: ex.tx.amountCents, invoiceDue: ex.tx.invoiceDue }, to: { amountCents: ex.tx.amountCents, invoiceDue: ex.tx.invoiceDue }, tx: ex.tx }); continue; }
      const amountCents = parts[free.indexOf(no)], pdate = E.addMonths(date, no - 1), inv = E.invoiceFor(card, pdate);
      const to = { amountCents, invoiceDue: inv.dueDate, purchaseDate: pdate };
      // a parcela nova/movida não pode cair, em silêncio, numa fatura que já foi paga ou fechada
      const tl = E.lockOf(m[inv.dueDate]), moving = !ex || ex.tx.invoiceDue !== inv.dueDate;
      if (tl && moving) {
        if (tl === 'paid') { res.blocked = `Com essa alteração, a parcela ${no} cairia na fatura de ${E.fmtDate(inv.dueDate)}, que já recebeu pagamento. Escolha outra data ou outro valor.`; return res; }
        if (!opts.allowClosed) { res.hasClosed = true; res.blocked = `Com essa alteração, a parcela ${no} cairia na fatura de ${E.fmtDate(inv.dueDate)}, que já está fechada. Para continuar, autorize alterar faturas fechadas.`; res.needsClosedOk = true; return res; }
        res.warnings.push(`A parcela ${no} entrará na fatura já fechada de ${E.fmtDate(inv.dueDate)}, porque você autorizou.`);

        if (!same) { addD(ex.tx.invoiceDue, -ex.tx.amountCents); addD(inv.dueDate, amountCents); }
        if (!same && ex.lock === 'closed') res.warnings.push(`A parcela ${no} está em fatura já fechada (${E.fmtDate(ex.tx.invoiceDue)}). Ela será alterada porque você autorizou.`);
      } else { res.plan.push({ no, action: 'add', lock: null, from: null, to }); addD(inv.dueDate, amountCents); }
    }
    rows.filter((r) => r.no > n).forEach((r) => { res.plan.push({ no: r.no, action: 'remove', lock: r.lock, from: { amountCents: r.tx.amountCents, invoiceDue: r.tx.invoiceDue }, to: null, tx: r.tx }); addD(r.tx.invoiceDue, -r.tx.amountCents); });
    res.impact = Object.keys(delta).filter((d) => delta[d] !== 0).sort().map((d) => ({ dueDate: d, deltaCents: delta[d], status: (m[d] || {}).status || 'open' }));
    if (frozen.length) res.warnings.push(`${frozen.length} parcela${frozen.length > 1 ? 's' : ''} de fatura paga ou fechada foi mantida sem alteração.`);
    res.protectedNos = frozen.map((r) => r.no);
    return res;
  };

  E.applyPurchaseEdit = (s, id, patch, opts = {}) => {
    const p = s.purchases.find((x) => x.id === id), pv = E.previewPurchaseEdit(s, id, patch, opts);
    if (pv.blocked) throw new Error(pv.blocked);
    const rowsAll = () => s.tx.filter((t) => t.purchaseId === id && t.kind === 'expense' && t.status !== 'cancelled');
    const oldDesc = p.desc; let changed = false;
    // dados que não mexem em valores
    if (patch.desc != null && patch.desc.trim() && patch.desc.trim() !== p.desc) { phist(p, `descrição: ${p.desc} → ${patch.desc.trim()}`); p.desc = patch.desc.trim(); changed = true; }
    if (patch.merchant != null && patch.merchant.trim() !== (p.merchant || '')) { phist(p, `estabelecimento: ${p.merchant || '—'} → ${patch.merchant.trim() || '—'}`); p.merchant = patch.merchant.trim(); changed = true; }
    if (patch.notes != null && patch.notes.trim() !== (p.notes || '')) { phist(p, 'observações alteradas'); p.notes = patch.notes.trim(); changed = true; }
    if (patch.categoryId !== undefined && (patch.categoryId || null) !== (p.categoryId || null)) {
      phist(p, `categoria: ${(p.categoryId || '—').replace(/^[ei]_/, '')} → ${(patch.categoryId || '—').replace(/^[ei]_/, '')}`);
      rowsAll().forEach((t) => { hist(t, `categoria: ${(t.categoryId || '—').replace(/^[ei]_/, '')} → ${(patch.categoryId || '—').replace(/^[ei]_/, '')}`); t.categoryId = patch.categoryId || null; });
      p.categoryId = patch.categoryId || null; changed = true;
    }
    if (pv.financial) {
      const card = s.cards.find((c) => c.id === (patch.cardId || p.cardId)), n = pv.newN, date = patch.date || p.date;
      const tmpl = rowsAll()[0] || s.tx.find((t) => t.purchaseId === id);
      const group = n > 1 ? (tmpl.installmentGroup || p.group || E.uid()) : null; if (group) p.group = group;
      pv.plan.forEach((pl) => {
        if (pl.action === 'update') {
          const t = pl.tx, bits = [];
          if (t.amountCents !== pl.to.amountCents) bits.push(`valor: ${E.brl(t.amountCents)} → ${E.brl(pl.to.amountCents)}`);
          if (t.invoiceDue !== pl.to.invoiceDue) bits.push(`fatura: ${E.fmtDate(t.invoiceDue)} → ${E.fmtDate(pl.to.invoiceDue)}`);
          if (t.purchaseDate !== pl.to.purchaseDate) bits.push(`data: ${E.fmtDate(t.purchaseDate)} → ${E.fmtDate(pl.to.purchaseDate)}`);
          if (pl.lock === 'closed') bits.push('fatura fechada: alteração confirmada pelo usuário');
          if (card.id !== t.cardId) { bits.push('cartão alterado'); t.cardId = card.id; }
          Object.assign(t, { amountCents: pl.to.amountCents, invoiceDue: pl.to.invoiceDue, dueDate: pl.to.invoiceDue, purchaseDate: pl.to.purchaseDate });
          if (bits.length) hist(t, bits.join('; '));
        } else if (pl.action === 'remove') { pl.tx.status = 'cancelled'; hist(pl.tx, 'removida: o parcelamento da compra foi reduzido'); }
        else if (pl.action === 'add') {
          const t = Object.assign(base(s, { desc: p.desc, categoryId: p.categoryId, context: tmpl.context, date: pl.to.purchaseDate, notes: p.notes }), { kind: 'expense', amountCents: pl.to.amountCents, cardId: card.id, invoiceDue: pl.to.invoiceDue, purchaseDate: pl.to.purchaseDate, dueDate: pl.to.invoiceDue, accountId: null, method: 'credit_card', purchaseId: id, originalDate: date, installmentNo: pl.no });
          s.tx.push(t); hist(t, 'criada na edição da compra');
        }
      });
      rowsAll().forEach((t) => {
        const no = t.installmentNo || (t.installmentNo = 1);
        if ((t.installmentTotal || 1) !== n) hist(t, `parcelamento: ${t.installmentTotal || 1}x → ${n}x`);
        t.installmentTotal = n; t.originalDate = date; if (group) t.installmentGroup = group;
        t.desc = p.desc + sfx(no, n);
      });
      const bits = [];
      if (pv.newTotal !== pv.oldTotal) bits.push(`valor total: ${E.brl(pv.oldTotal)} → ${E.brl(pv.newTotal)}`);
      if (n !== pv.oldN) bits.push(`parcelas: ${pv.oldN}x → ${n}x`);
      if (date !== p.date) bits.push(`data da compra: ${E.fmtDate(p.date)} → ${E.fmtDate(date)}`);
      if (card.id !== p.cardId) bits.push(`cartão: ${(s.cards.find((c) => c.id === p.cardId) || {}).name} → ${card.name}`);
      if (opts.allowClosed && pv.hasClosed) bits.push('inclui parcelas de fatura fechada (confirmado pelo usuário)');

    } else if (p.desc !== oldDesc) {
      rowsAll().forEach((t) => { const no = t.installmentNo || 1; hist(t, `descrição: ${t.desc} → ${p.desc + sfx(no, p.installments)}`); t.desc = p.desc + sfx(no, p.installments); });
    }
    if (pv.financial && p.desc !== oldDesc) { /* a descrição já foi refeita junto com as parcelas */ }
    return { changed, preview: pv };
  };

  E.previewPurchaseCancel = (s, id) => {
    const p = s.purchases.find((x) => x.id === id), rows = E.purchaseInstallments(s, id).filter((r) => !r.cancelled);
    const paid = rows.filter((r) => r.lock === 'paid'), closed = rows.filter((r) => r.lock === 'closed');
    return { blocked: !p ? 'Compra não encontrada.' : p.status === 'cancelled' ? 'Esta compra já foi cancelada.' : paid.length ? 'Há parcelas em fatura que já recebeu pagamento. Para devolver o dinheiro, use "Registrar estorno".' : null, closed: closed.map((r) => r.no), totalCents: rows.reduce((a, r) => a + r.tx.amountCents, 0), count: rows.length, due: rows.map((r) => r.tx.invoiceDue) };
  };
  E.cancelPurchase = (s, id, opts = {}) => {
    const pv = E.previewPurchaseCancel(s, id); if (pv.blocked) throw new Error(pv.blocked);
    if (pv.closed.length && !opts.allowClosed) throw new Error('Há parcelas em fatura fechada. Confirme que quer cancelar mesmo assim.');
    const p = s.purchases.find((x) => x.id === id);
    s.tx.filter((t) => t.purchaseId === id && t.status !== 'cancelled').forEach((t) => { t.status = 'cancelled'; hist(t, 'compra cancelada pelo usuário'); });
    p.status = 'cancelled'; phist(p, 'compra cancelada' + (pv.closed.length ? ' (inclui fatura fechada, confirmado pelo usuário)' : '')); return p;
  };
  // estorno: crédito na fatura (não mexe no saldo das contas e abate o "gasto")
  E.refundPurchase = (s, id, { amountCents, date }) => {
    needAmount(amountCents);
    const p = s.purchases.find((x) => x.id === id); if (!p || p.status === 'cancelled') throw new Error('Compra não encontrada.');
    const left = E.refundable(s, id);
    if (amountCents > left) throw new Error(`O estorno não pode passar do valor da compra (restam ${E.brl(left)}).`);
    const card = s.cards.find((c) => c.id === p.cardId), d = date || E.today(), inv = E.invoiceFor(card, d);
    const t = { id: E.uid(), kind: 'refund', context: p.context || card.context, desc: 'Estorno: ' + p.desc, categoryId: p.categoryId, amountCents, cardId: card.id, invoiceDue: inv.dueDate, purchaseDate: d, dueDate: inv.dueDate, paidDate: d, status: 'paid', purchaseId: id, history: [] };
    s.tx.push(t); hist(t, 'estorno registrado'); phist(p, `estorno de ${E.brl(amountCents)} na fatura de ${E.fmtDate(inv.dueDate)}`); return t;
  };

  E.cardSummary = (s, card, today = E.today()) => {
    const invs = E.invoices(s, card.id), lim = E.cardLimit(s, card);
    const open = invs.find((i) => i.status === 'open'), cur = open || null;
    const closedCents = invs.filter((i) => i.status === 'closed' && i.remainingCents > 0 && (!cur || i.dueDate < cur.dueDate)).reduce((a, i) => a + i.remainingCents, 0);
    const futureCents = invs.filter((i) => i.remainingCents > 0 && cur && i.dueDate > cur.dueDate).reduce((a, i) => a + i.remainingCents, 0);
    const spentMonthCents = s.tx.filter((t) => t.cardId === card.id && (t.kind === 'expense' || t.kind === 'refund') && t.status !== 'cancelled' && E.ym(t.purchaseDate) === E.ym(today)).reduce((a, t) => a + (t.kind === 'refund' ? -t.amountCents : t.amountCents), 0);
    return { limitCents: card.limitCents, usedCents: lim.usedCents, availableCents: lim.availableCents, current: cur, currentCents: cur ? cur.totalCents : 0, closedCents, futureCents, spentMonthCents };
  };

  const norm = (x) => String(x == null ? '' : x).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  E.cardEntries = (s, f = {}, ctx = 'all') => {
    const maps = {}, pmap = {}; (s.purchases || []).forEach((p) => { pmap[p.id] = p; });
    const q = norm(f.q).trim();
    const rows = [];
    s.tx.forEach((t) => {
      if (!t.cardId || (t.kind !== 'expense' && t.kind !== 'refund') || !inCtx(t, ctx)) return;
      if (t.status === 'cancelled' && !f.includeCancelled) return;
      const card = s.cards.find((c) => c.id === t.cardId); if (!card) return;
      const p = pmap[t.purchaseId], m = maps[card.id] || (maps[card.id] = invMap(s, card.id)), inv = m[t.invoiceDue];
      const cat = (s.categories.find((c) => c.id === t.categoryId) || {}).name || '';
      const r = { tx: t, purchase: p, card, desc: p ? p.desc : stripSfx(t.desc), merchant: p ? (p.merchant || '') : '', totalCents: p ? p.totalCents : t.amountCents, installmentCents: t.amountCents, no: t.installmentNo || 1, of: t.installmentTotal || 1, date: p ? p.date : t.purchaseDate, competence: t.purchaseDate, invoiceDue: t.invoiceDue, categoryName: cat,
        status: t.status === 'cancelled' ? 'cancelled' : t.kind === 'refund' ? 'refund' : (inv ? inv.status : 'open') };
      if (f.cardId && card.id !== f.cardId) return;
      if (f.month && E.ym(r.competence) !== f.month) return;
      if (f.invoice && r.invoiceDue !== f.invoice) return;
      if (f.categoryId && t.categoryId !== f.categoryId) return;
      if (f.merchant && !norm(r.merchant).includes(norm(f.merchant).trim())) return;
      if (f.type === 'installment' && r.of < 2) return;
      if (f.type === 'single' && r.of > 1) return;
      if (f.from && r.competence < f.from) return;
      if (f.to && r.competence > f.to) return;
      if (q) { const hay = norm([r.desc, r.merchant, cat, card.name, p && p.notes, E.brl(r.installmentCents), E.brl(r.totalCents), String(r.installmentCents / 100).replace('.', ',')].join(' ')); if (!q.split(/\s+/).every((w) => hay.includes(w))) return; }
      rows.push(r);
    });
    return rows.sort((a, b) => b.competence.localeCompare(a.competence) || b.date.localeCompare(a.date) || a.no - b.no);
  };


  // ───── 3) Orçamento por recebimento (plano de cada período)
  // s.plan = { income:[previsto dia A, previsto dia B], items:[{id,slot,name,kind,amountCents,dueDay,categoryId,active}], done:{'pk|itemId':true} }
  E.PLAN_KINDS = { fixed: 'Conta fixa', variable: 'Orçamento variável', reserve: 'Reserva de caixa', invest: 'Investimento', saving: 'Poupança' };
  const isAlloc = (k) => k === 'reserve' || k === 'invest' || k === 'saving';
  const nrm = (x) => String(x || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
  const planOf = (s) => { if (!s.plan) s.plan = { income: [0, 0], items: [], done: {} }; return s.plan; };
  E.planItems = (s, slot) => planOf(s).items.filter((i) => i.active !== false && (!slot || i.slot === slot));

function runMigrations() { const snap = JSON.stringify(S); const ch = E.migrate(S); if (ch) { if (!lsGet('fc_v1_pre2')) lsSet('fc_v1_pre2', snap); save(); } return ch; }
function scheduleSync() { if (!CLOUD || !user) return; dirty = true; syncState = 'syncing'; clearTimeout(pushTimer); pushTimer = setTimeout(push, 700); }
async function push() {
  if (!CLOUD || !user || pushing) return; pushing = true;
  try {
    if (cloudVer === 0) {
      const { error } = await sb.from('app_state').insert({ user_id: user.id, data: S, version: 1 });
      if (error) { if (String(error.code) === '23505') { pushing = false; return pull(true); } throw error; }
      cloudVer = 1;
    } else {
      const { data, error } = await sb.from('app_state').update({ data: S, version: cloudVer + 1, updated_at: new Date().toISOString() }).eq('user_id', user.id).eq('version', cloudVer).select('version');
      if (error) throw error;
      if (!data || !data.length) { pushing = false; return pull(true); }
      cloudVer = data[0].version;
    }
    dirty = false; syncState = 'ok'; syncAt = hhmm();
  } catch (e) { syncState = navigator.onLine === false ? 'offline' : 'error'; setTimeout(() => { if (dirty) scheduleSync(); }, 15000); }
  pushing = false; softRender();
}
async function pull(conflict) {
  try {
    const { data, error } = await sb.from('app_state').select('data,version').maybeSingle();
    if (error) throw error;
    if (data) {
      if (conflict) toast('Seus dados foram alterados em outro aparelho. Carregamos a versão mais recente.');
      const snap = JSON.stringify(data.data); S = data.data; fixState(); const mig = E.migrate(S); syncPref(); initHide(); cloudVer = data.version; keepLocal(); dirty = false; syncState = 'ok'; syncAt = hhmm(); if (mig) { if (!lsGet('fc_v1_pre2')) lsSet('fc_v1_pre2', snap); save(); }
    } else { S.profile.mode = PREF.mode; S.profile.palette = PREF.palette; cloudVer = 0; await push(); }
  } catch (e) { syncState = navigator.onLine === false ? 'offline' : 'error'; }
  softRender();
}
const softRender = () => { if (!$('#sheetbg') && !$('#drawer') && user) render(); };

window.doLogin = async () => {
  const email = val('lg-e').trim(), password = val('lg-p');
  if (!email || !password) return toast('Informe e-mail e senha.');
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) return toast(/confirm/i.test(error.message) ? 'Confirme seu e-mail primeiro (veja sua caixa de entrada).' : 'E-mail ou senha incorretos.');
  user = data.user; await afterLogin();
};
window.doSignup = async () => {
  const email = val('lg-e').trim(), password = val('lg-p');
  if (!email || password.length < 6) return toast('Use um e-mail válido e senha com 6+ caracteres.');
  const { data, error } = await sb.auth.signUp({ email, password });
  if (error) return toast('Não foi possível criar a conta: ' + error.message);
  if (!data.session) return renderLogin('Conta criada. Enviamos um e-mail de confirmação. Confirme e depois toque em Entrar.');
  user = data.user; await afterLogin();
};
async function afterLogin() {
  $('#nav').style.display = ''; syncState = 'syncing';
  await pull(false);
  if (S.recurrences && S.recurrences.length && E.generateRecurring(S, E.today(), 12)) save();
  render();
}
window.doLogout = async () => { await sb.auth.signOut(); user = null; cloudVer = 0; try { localStorage.removeItem(KEY); } catch (e) {} S = E.newState(); fixState(); closeSheet(); renderLogin(); };
async function bootCloud() {
  sb = window.supabase.createClient(CFG.url, CFG.key);
  const { data } = await sb.auth.getSession();
  if (!data || !data.session) return renderLogin();
  user = data.session.user; await afterLogin();
  window.addEventListener('online', () => { if (dirty) scheduleSync(); else pull(false); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && user && !dirty) pull(false); });
}

window.openRecurring = () => { if (needAccount()) return; sheet(`<h2>Conta mensal</h2><p class="lead">Criamos os próximos 12 meses como “a pagar”. Você confirma cada um quando acontecer.</p>${F('Tipo', `<div class="seg" style="margin:0"><button id="rk1" class="on" onclick="window._rk='expense';rk1.classList.add('on');rk0.classList.remove('on')">Despesa</button><button id="rk0" onclick="window._rk='income';rk0.classList.add('on');rk1.classList.remove('on')">Entrada</button></div>`)}${F('Nome', '<input id="rc-d" placeholder="Ex.: Aluguel">')}${F('Valor', '<input id="rc-v" inputmode="decimal" placeholder="R$ 0,00">')}${F('Dia do mês', '<input id="rc-day" type="number" min="1" max="31" value="5">')}${F('Recebimento do dia', `<select id="rc-slot"><option value="">Decidir depois</option><option value="1">Dia ${E.cfg(S).payDays[0]}</option><option value="2">Dia ${E.cfg(S).payDays[1]}</option></select>`, 'Despesa: é paga com o recebimento escolhido. Entrada: define o período em que ela entra.')}${F('Conta', `<select id="rc-a">${accOpts()}</select>`)}${F('Categoria', `<select id="rc-c">${catOpts('expense')}</select>`)}<div style="height:22px"></div><button class="btn" onclick="saveRec()">Programar</button>`); window._rk = 'expense'; };
window.saveRec = () => { try { const acc = S.accounts.find((a) => a.id === val('rc-a')); E.addRecurring(S, { kind: window._rk, desc: val('rc-d'), amountCents: E.toCents(val('rc-v')), accountId: acc.id, categoryId: val('rc-c'), day: +val('rc-day'), startDate: E.today(), context: acc.context, fundSlot: +val('rc-slot') || null }); save(); closeSheet(); toast('Programado'); render(); } catch (e) { toast(e.message); } };

window.confirmTx = (id) => { const t = S.tx.find((x) => x.id === id), inc = t.kind === 'income'; sheet(`<h2>${inc ? 'Confirmar recebimento' : 'Confirmar pagamento'}</h2><p class="lead">${esc(t.desc)} · vence em ${fd(t.dueDate)}. Só marcamos como ${inc ? 'recebido' : 'pago'} depois da sua confirmação.</p>${F('Data', `<input id="cf-d" type="date" value="${E.today()}">`)}${F(inc ? 'Valor recebido' : 'Valor pago', `<input id="cf-v" inputmode="decimal" value="${moneyIn(t.amountCents)}">`)}<div style="height:22px"></div><button class="btn" onclick="doConfirm('${id}')">Confirmar</button><div style="height:10px"></div><button class="btn ghost" onclick="openResched('${id}')">Mudar o vencimento</button>`); };
window.doConfirm = (id) => { try { E.confirm(S, id, { date: val('cf-d'), cents: E.toCents(val('cf-v')) }); save(); closeSheet(); toast('Confirmado'); render(); } catch (e) { toast(e.message); } };
window.openResched = (id) => sheet(`<h2>Novo vencimento</h2>${F('Data', `<input id="rs-d" type="date" value="${E.today()}">`)}<div style="height:22px"></div><button class="btn" onclick="E.reschedule(S,'${id}',val('rs-d'));save();closeSheet();render()">Salvar</button>`);
window.openPayInvoice = (cardId, due) => { const inv = E.invoices(S, cardId).find((i) => i.dueDate === due); sheet(`<h2>Pagar fatura</h2><p class="lead">Vence em ${fd(due)}. Pagar a fatura não cria nova despesa, as compras já foram contadas.</p><div class="big">${brl(inv.remainingCents)}</div>${F('Sai de qual conta?', `<select id="pi-a">${accOpts()}</select>`)}${F('Valor', `<input id="pi-v" inputmode="decimal" value="${moneyIn(inv.remainingCents)}">`, 'Você pode pagar só uma parte.')}<div style="height:22px"></div><button class="btn" onclick="doPayInv('${cardId}','${due}')">Confirmar pagamento</button>`); };
window.doPayInv = (c, d) => { try { E.payInvoice(S, { cardId: c, dueDate: d, accountId: val('pi-a'), amountCents: E.toCents(val('pi-v')), date: E.today() }); save(); closeSheet(); toast('Fatura paga'); render(); } catch (e) { toast(e.message); } };
const statusOf = (t) => t.status === 'cancelled' ? ['Cancelado', ''] : t.kind === 'refund' ? ['Estorno', 'ok'] : t.status === 'paid' ? [t.kind === 'income' ? 'Recebido' : 'Pago', 'ok'] : E.isOverdue(t, E.today()) ? ['Atrasada', 'bad'] : t.cardId ? ['No cartão', 'pri'] : (() => { const d = E.diffDays(E.today(), t.dueDate); return d === 0 ? ['Vence hoje', 'warn'] : d === 1 ? ['Vence amanhã', 'warn'] : ['Pendente', '']; })();
window.openTx = (id) => { const t = S.tx.find((x) => x.id === id); if (t && t.cardId && t.purchaseId && S.purchases.some((p) => p.id === t.purchaseId)) return openPurchase(t.purchaseId, id); openTxPlain(id); };
window.openTxPlain = (id) => {
  const t = S.tx.find((x) => x.id === id), st = statusOf(t), inc = t.kind === 'income';
  sheet(`<h2>${esc(t.desc)}</h2><div class="big ${inc ? 'pos' : ''}">${brl(t.amountCents)}</div><span class="pill ${st[1]}">${st[0]}</span>
  <div class="card" style="margin:16px 0 0"><div class="stat"><span>Categoria</span><b>${esc(catName(t.categoryId))}</b></div>${t.kind === 'expense' && !t.cardId ? `<div class="stat"><span>Paga com o recebimento</span><b>${t.fund ? E.fundLabel(S, t.fund) : 'Sem vínculo'}</b></div>` : t.kind === 'income' ? `<div class="stat"><span>Período de recebimento</span><b>Dia ${E.cfg(S).payDays[E.slotOf(S, t) - 1]}</b></div>` : ''}<div class="stat"><span>Data da compra</span><b>${fd(t.purchaseDate)}</b></div><div class="stat"><span>Vencimento</span><b>${fd(t.dueDate) || '—'}</b></div>${t.paidDate ? `<div class="stat"><span>Pagamento</span><b>${fd(t.paidDate)}</b></div>` : ''}</div>
  ${t.kind === 'expense' && !t.cardId && t.status !== 'cancelled' ? `<button class="link" onclick="openLink('tx','${t.id}')">Escolher o recebimento desta conta</button>` : ''}<details class="how" style="padding:12px 0 0"><summary>Histórico de alterações</summary>${(t.history || []).map((h) => fd(h.at.slice(0, 10)) + ' · ' + esc(h.what)).join('<br>')}</details>
  <div style="height:16px"></div>${t.status !== 'cancelled' && t.kind !== 'transfer' && t.kind !== 'invoice_payment' ? `<button class="btn ghost" onclick="openEdit('${t.id}')">Editar lançamento</button><div style="height:10px"></div>` : ''}${t.status === 'pending' && !t.cardId ? `<button class="btn" onclick="confirmTx('${t.id}')">${inc ? 'Confirmar recebimento' : 'Confirmar pagamento'}</button><div style="height:10px"></div>` : ''}${t.status !== 'cancelled' && t.kind !== 'invoice_payment' ? `<button class="link" style="color:var(--bad)" onclick="ask('Cancelar este lançamento? Ele continua no histórico, só deixa de contar.', () => {E.cancel(S,'${t.id}');save();render()}, 'Cancelar lançamento')">Cancelar lançamento</button>` : ''}`);
};
window.openEditAccount = (id) => {
  const a = S.accounts.find((x) => x.id === id), b = E.accountBalance(S, a);
  sheet(`<h2>Editar conta</h2><p class="lead">Saldo atual: <b>${brl(b)}</b></p>${F('Nome', `<input id="ea-n" value="${esc(a.name)}">`)}${F('Saldo inicial', `<input id="ea-v" inputmode="decimal" value="${moneyIn(a.openingCents)}">`, 'É o valor com que a conta começou. Os lançamentos são somados a ele. Se mudar, o saldo atual muda na mesma medida.')}<div style="height:22px"></div><button class="btn" onclick="saveAccountEdit('${id}')">Salvar alterações</button><div style="height:10px"></div><button class="link" style="color:var(--bad)" onclick="ask('Arquivar esta conta? Ela some das listas e do saldo, mas os lançamentos continuam no histórico.', () => {S.accounts.find((x) => x.id === '${id}').archived = true;save();render()}, 'Arquivar conta')">Arquivar conta</button>`);
};
window.saveAccountEdit = (id) => {
  try {
    const a = S.accounts.find((x) => x.id === id), n = val('ea-n').trim(), v = val('ea-v') ? E.toCents(val('ea-v')) : 0;
    if (!n) throw new Error('Dê um nome para a conta.'); if (isNaN(v)) throw new Error('Valor inválido.');
    if (S.accounts.some((x) => x.id !== id && x.context === a.context && x.name.toLowerCase() === n.toLowerCase())) throw new Error('Você já tem uma conta com esse nome.');
    a.name = n; a.openingCents = v; save(); closeSheet(); toast('Conta atualizada'); render();
  } catch (e) { toast(e.message); }
};
window.openEdit = (id) => {
  const t = S.tx.find((x) => x.id === id), inc = t.kind === 'income', dt = t.cardId ? null : (t.status === 'paid' ? t.paidDate : t.dueDate);
  sheet(`<h2>Editar lançamento</h2><p class="lead">As mudanças ficam registradas no histórico.</p>
  ${F('Descrição', `<input id="e-desc" value="${esc(t.desc)}">`)}
  ${F('Valor', `<input id="e-val" inputmode="decimal" value="${moneyIn(t.status === 'paid' ? (t.paidCents || t.amountCents) : t.amountCents)}" ${t.cardId ? 'disabled' : ''}>`, t.cardId ? 'O valor de compra no cartão não muda aqui. Cancele e lance de novo se precisar.' : '')}
  ${dt ? F(t.status === 'paid' ? (inc ? 'Data do recebimento' : 'Data do pagamento') : 'Vencimento', `<input id="e-date" type="date" value="${dt}">`) : ''}
  ${F('Categoria', `<select id="e-cat">${catOpts(inc ? 'income' : 'expense', t.categoryId)}</select>`)}
  ${t.kind === 'expense' && !t.cardId && E.planItems(S).some((i) => ['fixed', 'variable'].includes(i.kind)) ? F('Item do orçamento', `<select id="e-plan"><option value="">Automático</option>${planOpts(t.planItemId)}</select>`) : ''}
  ${t.kind === 'expense' && !t.cardId ? F('Paga com qual recebimento?', `<select id="e-fund"><option value="">Sem vínculo</option>${[...new Set(E.fundOptions(S, t.dueDate || t.purchaseDate).concat(t.fund ? [t.fund] : []))].map((pk) => `<option value="${pk}" ${pk === t.fund ? 'selected' : ''}>${E.fundLabel(S, pk)}</option>`).join('')}</select>`) : ''}
  ${inc ? F('Período de recebimento', `<select id="e-slot"><option value="">Automático (pela data)</option><option value="1" ${t.slot === 1 ? 'selected' : ''}>Dia ${E.cfg(S).payDays[0]}</option><option value="2" ${t.slot === 2 ? 'selected' : ''}>Dia ${E.cfg(S).payDays[1]}</option></select>`) : ''}
  <div style="height:22px"></div><button class="btn" onclick="saveEdit('${id}')">Salvar alterações</button>`);
};
window.saveEdit = (id) => {
  try {
    const t = S.tx.find((x) => x.id === id), patch = { desc: val('e-desc').trim(), categoryId: val('e-cat') };
    if (!patch.desc) throw new Error('Diga o que foi.');
    if (t.kind === 'expense' && !t.cardId) patch.fund = val('e-fund') || null;
    if (document.getElementById('e-plan')) patch.planItemId = val('e-plan') || null;
    if (t.kind === 'income') patch.slot = +val('e-slot') || null;
    if (!t.cardId) {
      const c = E.toCents(val('e-val')); if (!Number.isInteger(c) || c <= 0) throw new Error('Informe um valor maior que zero.');
      patch.amountCents = c; if (t.status === 'paid') patch.paidCents = c;
      const d = val('e-date'); if (!d) throw new Error('Informe a data.');
      if (t.status === 'paid') patch.paidDate = d; else patch.dueDate = d;
      patch.purchaseDate = d;
    }
    E.edit(S, id, patch); save(); closeSheet(); toast('Lançamento atualizado'); render();
  } catch (e) { toast(e.message); }
};
window.openSettings = () => sheet(`<h2>Configurações</h2>${F('Seu nome', `<input id="s-n" value="${esc(S.profile.name)}">`)}
  <div style="height:8px"></div>${optBtn('brush', 'Personalizar aparência', esc(palName()), 'openAppearance()')}${optBtn('cal', 'Dias de recebimento', 'Dia ' + E.cfg(S).payDays[0] + ' e dia ' + E.cfg(S).payDays[1], 'openPayDays()')}
  ${F('Saldo ao abrir o app', `<div class="seg" style="margin:0"><button class="${!S.prefs.startHidden ? 'on' : ''}" onclick="S.prefs.startHidden=false;save();openSettings()">Visível</button><button class="${S.prefs.startHidden ? 'on' : ''}" onclick="S.prefs.startHidden=true;save();openSettings()">Oculto</button></div>`, 'No painel, o ícone de olho esconde ou mostra o saldo na hora. É só privacidade visual e não substitui a senha do app.')}
  <div style="height:22px"></div><button class="btn" onclick="S.profile.name=val('s-n')||'Renan';save();closeSheet();render()">Salvar</button>
  ${CLOUD && user ? `<p class="foot" style="text-align:left">Conectado como <b>${esc(user.email)}</b>. ${syncLabel()}.</p><button class="btn ghost" onclick="doLogout()">Sair desta conta</button><div style="height:10px"></div>` : `<p class="foot" style="text-align:left">Versão de teste: os dados ficam só neste navegador. Faça backup pelo menu.</p>`}<button class="link" onclick="openImport()">Restaurar backup</button><br>${CLOUD ? '' : `<button class="link" style="color:var(--bad)" onclick="ask('Apagar TODOS os dados deste aparelho? Não dá para desfazer.', () => {try{localStorage.removeItem('fc_v1')}catch(e){};location.reload()}, 'Apagar tudo')">Apagar dados deste aparelho</button>`}`);
window.exportData = () => { const j = JSON.stringify(S); sheet(`<h2>Backup dos dados</h2><p class="lead">Copie e guarde em lugar seguro, como Notas ou um e-mail para você mesmo.</p><textarea id="bk" rows="6" readonly>${esc(j)}</textarea><div style="height:14px"></div><button class="btn" onclick="const t=document.getElementById('bk');t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast('Copiado'),()=>toast('Selecione e copie manualmente'))}catch(e){toast('Selecione e copie manualmente')}">Copiar backup</button>`); };

// ───── blocos de tela
const money = (c, cls = '') => { const neg = c < 0, a = Math.abs(c), r = String(Math.floor(a / 100)).replace(/\B(?=(\d{3})+(?!\d))/g, '.'), d = String(a % 100).padStart(2, '0'); return `<span class="money ${cls} ${neg ? 'neg' : ''}">${neg ? '−' : ''}R$ ${r}<span class="d">,${d}</span></span>`; };
const topbar = (hello) => `<div class="top"><button class="who" onclick="openDrawer()" aria-label="Abrir menu"><div class="av">${esc(S.profile.name[0].toUpperCase())}</div>${hello ? `<span>Olá, <b>${esc(S.profile.name)}</b></span>` : ''}</button><button class="ctxpill" onclick="openCtx()">${CTXN[ctx()]}${ic('chevD')}</button></div>`;
window.openCtx = () => sheet(`<h2>Qual visão?</h2><p class="lead">Pessoal e profissional ficam separados. O consolidado só soma para consulta.</p>${['personal', 'business', 'all'].map((k) => `<button class="opt" onclick="setCtx('${k}')"><span class="sq">${ic(k === 'business' ? 'brief' : k === 'all' ? 'chart' : 'user')}</span><span class="t"><b>${CTXN[k]}</b><small>${{ personal: 'Suas finanças pessoais', business: 'Suas atividades profissionais', all: 'Soma das duas, só leitura' }[k]}</small></span>${ctx() === k ? ic('check', 'chev') : ''}</button>`).join('')}`);
const pageH = (t, lead, action) => `<div class="page-h"><div><h1>${t}</h1>${lead ? `<div class="lead">${lead}</div>` : ''}</div>${action || ''}</div>`;
const monthPicker = () => `<div class="mpick"><button onclick="chMonth(-1)" aria-label="Mês anterior">${ic('chevL')}</button><b>${MONTHS[+month.slice(5) - 1]} ${month.slice(0, 4)}</b><button onclick="chMonth(1)" aria-label="Próximo mês">${ic('chevR')}</button></div>`;
window.chMonth = (n) => { month = E.addMonths(month + '-01', n).slice(0, 7); render(); };
const empty = (i, t, s, btn) => `<div class="empty">${ic(i)}<b>${t}</b>${s}${btn || ''}</div>`;

const txRow = (t) => {
  const inc = t.kind === 'income', rf = t.kind === 'refund', tr = t.kind === 'transfer', ip = t.kind === 'invoice_payment', st = statusOf(t);
  const icon = inc ? 'down' : rf ? 'undo' : tr ? 'swap' : ip ? 'card' : null;
  const when = rf ? 'Fatura ' + fd(t.invoiceDue) : t.status === 'paid' ? (inc ? 'Recebido em ' : 'Pago em ') + fd(t.paidDate) : t.cardId ? 'Fatura ' + fd(t.invoiceDue) : st[0] === 'Pendente' ? 'Vence ' + fd(t.dueDate) : st[0] === 'Atrasada' ? 'Atrasada desde ' + fd(t.dueDate) : st[0];
  const kind = inc ? 'Entrada' : rf ? 'Estorno' : tr ? 'Transferência' : ip ? 'Fatura' : esc(catName(t.categoryId));
  return `<div class="row" onclick="openTx('${t.id}')"><div class="sq">${icon ? ic(icon) : catIcon(t.categoryId)}</div><div class="m"><b>${esc(t.desc)}</b><small class="${st[1]}">${kind} · ${when}</small></div><div class="a ${inc || rf ? 'pos' : st[1] === 'bad' ? 'bad' : st[1] === 'warn' ? 'warn' : ''}">${inc || rf ? '+' : tr ? '' : '−'}${brl(t.amountCents)}</div></div>`;
};
const invRow = (u) => `<div class="row" onclick="openInvoice('${u.cardId}','${u.dueDate}')"><div class="sq">${ic('card')}</div><div class="m"><b>${esc(u.desc)}</b><small class="${u.overdue ? 'bad' : 'warn'}">${u.overdue ? 'Atrasada · ' : ''}Vence ${fd(u.dueDate)}</small></div><div class="a ${u.overdue ? 'bad' : 'warn'}">−${brl(u.amountCents)}</div></div>`;
const listCtx = () => S.tx.filter((t) => ctx() === 'all' || t.context === ctx());

const partMoney = (c) => { const a = Math.abs(c), r = String(Math.floor(a / 100)).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); return (c < 0 ? '−' : '') + 'R$ ' + r + `<span class="d">,${String(a % 100).padStart(2, '0')}</span>`; };
const balHtml = () => {
  const m = E.monthSummary(S, month, ctx(), E.today()), nacc = ctxAccounts().length, neg = m.projectedCents < 0;
  return `<div class="lblrow"><span class="lbl">Saldo disponível hoje</span><button class="eye" onclick="toggleBal()" aria-label="${hideBal ? 'Mostrar saldo disponível' : 'Ocultar saldo disponível'}" aria-pressed="${hideBal}">${ic(hideBal ? 'eyeoff' : 'eye')}</button></div>
  <div class="num">${hideBal ? '<span class="money msk" aria-label="Saldo oculto">••••••••</span>' : money(m.availableCents)}<span class="badge ${neg ? 'neg' : ''}">${neg ? 'Projeção negativa' : 'Vai sobrar ' + brl(m.projectedCents)}</span></div>
  <div class="lead" style="margin-top:10px">${nacc ? `Somando ${nacc} conta${nacc > 1 ? 's' : ''}. ` : ''}<button class="link" style="padding:0" onclick="go('bancos')">${nacc ? 'Ver contas' : 'Cadastrar conta'}</button></div>`;
};
window.setView = (v) => { S.prefs.view = v; save(); render(); };
const periodTiles = (pk) => {
  const p = E.periodSummary(S, pk, ctx(), E.today()), q = E.parsePk(pk);
  return `<div class="lead" style="margin:-4px 2px 12px">Dia ${E.cfg(S).payDays[q.slot - 1]} · ${p.range.start.slice(8)}/${p.range.start.slice(5, 7)} a ${p.range.end.slice(8)}/${p.range.end.slice(5, 7)}</div>
  <div class="kgrid"><div class="glass kpi"><div class="t"><i class="dot" style="background:var(--ok)"></i>Total recebido</div><div class="v">${partMoney(p.receivedCents)}</div></div><div class="glass kpi"><div class="t"><i class="dot" style="background:var(--grad2)"></i>Total previsto</div><div class="v">${partMoney(p.expectedCents)}</div></div></div>
  <div class="kgrid"><div class="glass kpi"><div class="t">Despesas vinculadas</div><div class="v">${partMoney(p.linkedCents)}</div></div><div class="glass kpi"><div class="t">Contas pendentes · ${p.pendingCount}</div><div class="v">${partMoney(p.pendingCents)}</div></div></div>
  <div class="kgrid"><div class="glass kpi"><div class="t">Contas pagas · ${p.paidCount}</div><div class="v">${partMoney(p.paidCents)}</div></div><div class="glass kpi"><div class="t">Saldo projetado</div><div class="v ${p.projectedCents < 0 ? 'neg' : ''}">${partMoney(p.projectedCents)}</div></div></div>
  <div class="glass sobrar" style="margin-bottom:12px"><div><div class="t">Saldo disponível do período</div><div class="v ${p.availableCents < 0 ? 'neg' : ''}">${partMoney(p.availableCents)}</div><small>Só o que já entrou menos o que já foi pago</small></div><button class="link" onclick="go('rec')">Detalhes</button></div>
  ${E.planItems(S).length ? (() => { const P = E.planPeriod(S, pk, ctx()); return `<div class="glass sobrar" style="margin-bottom:12px" onclick="go('orc')"><div><div class="t">Orçamento deste recebimento</div><div class="v ${P.balanceCents < 0 ? 'neg' : ''}">${partMoney(P.balanceCents)}</div><small>Sobra do plano · planejado ${brl(P.plannedTotal)} de ${brl(P.incomeBase)}</small></div><button class="link" style="padding:0">Abrir</button></div>`; })() : ''}
  <details class="how"><summary>Como calculamos?</summary>Previsto: tudo que você espera receber neste período. Recebido: o que você já confirmou. Projetado: previsto − despesas vinculadas. Disponível: recebido − o que já foi pago. Receita que ainda não entrou nunca conta como dinheiro disponível.</details>`;
};
function vInicio() {
  const today = E.today(), m = E.monthSummary(S, month, ctx(), today), ups = E.upcoming(S, 7, ctx(), today), ins = E.insights(S, ctx(), today);
  const first = !S.accounts.length, view = S.prefs.view || 'month', pd = E.cfg(S).payDays;
  const seg = `<div class="seg" role="group" aria-label="Período do painel">${[['month', 'Visão geral'], ['1', 'Dia ' + pd[0]], ['2', 'Dia ' + pd[1]]].map(([k, l]) => `<button class="${view === k ? 'on' : ''}" aria-pressed="${view === k}" onclick="setView('${k}')">${l}</button>`).join('')}</div>`;
